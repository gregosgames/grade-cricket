const BOWLERS = [
  { key: 'fast', name: 'FAST', pace: [21.0, 23.5], vars: [
      { n: 'HEAVY',    band: 'good',    swing: 0.3, seam: 0.45 },
      { n: 'BOUNCER',  band: 'bouncer', swing: 0.2, seam: 0.30 },
      { n: 'YORKER',   band: 'yorker',  swing: 0.4, seam: 0.20, paceMul: 1.03 } ] },
  { key: 'swing', name: 'SWING', pace: [18.5, 20.5], vars: [
      { n: 'OUTSWING', band: 'full',    swing: 2.6,  seam: 0.25 },
      { n: 'INSWING',  band: 'full',    swing: -2.6, seam: 0.25 },
      { n: 'SLOWER',   band: 'good',    swing: 1.4,  seam: 0.25, paceMul: 0.80 } ] },
  { key: 'seam', name: 'SEAM', pace: [19.0, 21.0], vars: [
      { n: 'SEAM UP',  band: 'good',    swing: 0.3, seam: 1.55 },
      { n: 'CROSS',    band: 'good',    swing: 0.2, seam: 0.15, bounceMul: 0.88 },
      { n: 'CUTTER',   band: 'back',    swing: 0.2, seam: -1.35, paceMul: 0.90 } ] },
  { key: 'medium', name: 'MEDIUM PACE', pace: [16.5, 18.5], vars: [
      { n: 'STOCK',    band: 'good',    swing: 0.6, seam: 0.70 },
      { n: 'SLOWER',   band: 'good',    swing: 0.5, seam: 0.50, paceMul: 0.78 },
      { n: 'CUTTER',   band: 'back',    swing: 0.3, seam: -1.05, paceMul: 0.88 } ] },
  { key: 'finger', name: 'FINGER SPIN', pace: [13.0, 15.0], vars: [
      { n: 'OFF BREAK', band: 'good',   swing: 0.2, seam: -1.85, bounceMul: 1.12 },
      { n: 'ARM BALL',  band: 'full',   swing: 1.1, seam: -0.15 },
      { n: 'TOP SPIN',  band: 'good',   swing: 0.2, seam: -0.45, bounceMul: 1.28 } ] },
  { key: 'wrist', name: 'WRIST SPIN', pace: [12.5, 14.5], vars: [
      { n: 'LEG BREAK', band: 'good',   swing: 0.2, seam: 2.05, bounceMul: 1.15 },
      { n: 'GOOGLY',    band: 'good',   swing: 0.2, seam: -1.70, bounceMul: 1.10 },
      { n: 'SLIDER',    band: 'back',   swing: 0.3, seam: -0.20, bounceMul: 0.88, paceMul: 1.06 } ] },
];
const bandByKey = k => BANDS.filter(b => b.key === k)[0] || BOUNCER_BAND;

/* Base timing windows in seconds, before any modifier. */
const WIN = { middle: 0.052, good: 0.104, edge: 0.176 };

/* Two tiers is the whole ladder in the slice. The jump between them is a

const TIERS = [

    pace: [17.4, 19.2], wayward: 0.42, markerLead: 0.62,
    aiSigma: 0.115, aiWindow: 1.0, newBatter: 0.15,
    liveField: false, dossier: false, fieldSpread: 0.80, boundary: 52, fieldSpeed: 5.8,
    crowd: 0.35, colour: '#c98a2e',
  },
  {
    key: 'island', name: 'ISLAND SENIOR', short: 'ISLAND',
    pace: [19.4, 22.0], wayward: 0.19, markerLead: 0.44,
    aiSigma: 0.086, aiWindow: 0.88, newBatter: 0.0,
    liveField: true, dossier: true, fieldSpread: 0.88, boundary: 58, fieldSpeed: 7.1,
    crowd: 0.7, colour: '#e8b923',
  },
];

const PAL = {
  sky: '#57b6e8', skyHi: '#9fdcf5',
  grass: '#3f9c41', grassDark: '#2f7c34', grassLight: '#59b75a',
  pitch: '#c9a86a', pitchEdge: '#b08f52',
  maroon: '#7a1420', maroonLite: '#a81e2f', gold: '#e8b923',
  ink: '#14181c', white: '#f4f1e8', ball: '#b8202c',
};

/* ===================== SMALL UTILITIES ===================== */
const boundaryR = () => (M && M.tier && M.tier.boundary) || BOUNDARY;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const deg = d => d * Math.PI / 180;
function randn() {                       // Box-Muller, for deviation cones
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const now = () => performance.now() / 1000;

/* ===================== CRAZYGAMES PORTAL SHIM ===================== */
/* The SDK is injected by the portal when the game runs there. Every call is
   guarded so the build is identical on and off CrazyGames. */
const Portal = {
  sdk: null,
  init() { try { this.sdk = window.CrazyGames && window.CrazyGames.SDK || null; } catch (e) { this.sdk = null; } },
  loadStart() { try { this.sdk && this.sdk.game.loadingStart(); } catch (e) {} },
  loadStop() { try { this.sdk && this.sdk.game.loadingStop(); } catch (e) {} },
  playStart() { try { this.sdk && this.sdk.game.gameplayStart(); } catch (e) {} },
  playStop() { try { this.sdk && this.sdk.game.gameplayStop(); } catch (e) {} },
  happy() { try { this.sdk && this.sdk.game.happytime(); } catch (e) {} },
};

/* ===================== SAVE ===================== */
const Save = {
  key: 'grade-cricket-v1',
  data: { bestRuns: 0, bestFigs: null, played: 0, seen: false },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) { /* private mode — play on, just don't remember */ }
  },

    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  },
};

/* ===================== AUDIO =====================
   The soundtrack is a feedback instrument, not a backing track. A layered
   percussion loop is scheduled ahead of the audio clock; which layers are
   audible is driven by Swagger when batting and Hostility when bowling. The
   player feels the meter before they read it. Everything is synthesised —
   no sample files, so the game stays a single portable file. */
const Snd = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  on: true, running: false,
  step: 0, nextTime: 0, bpm: 104,
  intensity: 0, mode: 'bat',    // 0..1, drives which layers play
  crowdNode: null, crowdGain: null, crowdFilter: null,

  boot() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.on = false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.85;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.55;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);
    this.startCrowd();
    this.nextTime = this.ctx.currentTime + 0.1;
    this.running = true;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggle() {
    this.on = !this.on;
    if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.85 : 0, this.ctx.currentTime, 0.05);
  },

  noiseBuffer(sec) {
    const n = Math.floor(this.ctx.sampleRate * sec);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },

  /* Crowd bed: filtered noise whose brightness and level is the tier readout.
     Close and personal at club level, a wall internationally. */
  startCrowd() {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(3);
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 620; f.Q.value = 0.6;
    const g = this.ctx.createGain();
    g.gain.value = 0.05;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    this.crowdNode = src; this.crowdGain = g; this.crowdFilter = f;
  },
  crowd(level, dur) {                    // a swell for a boundary or a wicket
    if (!this.crowdGain) return;
    const t = this.ctx.currentTime;
    this.crowdGain.gain.cancelScheduledValues(t);
    this.crowdGain.gain.setValueAtTime(this.crowdGain.gain.value, t);
    this.crowdGain.gain.linearRampToValueAtTime(level, t + 0.06);
    this.crowdGain.gain.linearRampToValueAtTime(0.05, t + (dur || 1.4));
  },

  /* --- one-shot voices --- */
  kick(t, gain) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.3);
  },
  hat(t, gain, open) {
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.2);
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
    const g = this.ctx.createGain();
    const d = open ? 0.16 : 0.035;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.musicGain); s.start(t); s.stop(t + d + 0.02);
  },
  conga(t, freq, gain) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * 1.7, t);
    o.frequency.exponentialRampToValueAtTime(freq, t + 0.05);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.24);
  },
  clave(t, gain) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = 1180;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.08);
  },
  bassNote(t, freq, gain, dur) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + (dur || 0.4) + 0.05);
  },

  /* --- the loop --- */
  tick() {
    if (!this.running || !this.ctx) return;
    const spb = 60 / this.bpm / 2;       // eighth notes
    while (this.nextTime < this.ctx.currentTime + 0.25) {
      this.schedule(this.step % 16, this.nextTime);
      this.step++;
      this.nextTime += spb;
    }
  },
  schedule(s, t) {
    const I = this.intensity;
    if (this.mode === 'bat') {
      /* Baseline is a hi-hat and the crowd. Layers stack as Swagger builds —
         the ground starts playing for you. */
      this.hat(t, s % 2 === 0 ? 0.12 : 0.06, s % 8 === 6 && I > 0.55);
      if (I > 0.12 && (s === 0 || s === 6 || s === 10)) this.kick(t, 0.5);
      if (I > 0.36 && (s === 4 || s === 12)) this.clave(t, 0.16);
      if (I > 0.58 && (s === 2 || s === 7 || s === 11 || s === 14)) this.conga(t, s === 7 ? 210 : 158, 0.3);
      if (I > 0.80) {
        if (s === 3 || s === 9) this.conga(t, 300, 0.26);
        if (s % 4 === 0) this.bassNote(t, [82.4, 82.4, 110, 98][(s / 4) | 0], 0.22, 0.34);
      }
    } else {
      /* Bowling inverts it: low, sparse and threatening, thickening as the
         batter starts to flinch. */
      if (s === 0 || s === 8) this.kick(t, 0.55 + I * 0.35);
      if (I > 0.25 && (s === 6 || s === 14)) this.conga(t, 96, 0.28 + I * 0.2);
      if (I > 0.45 && s % 4 === 2) this.hat(t, 0.05 + I * 0.05, false);
      if (I > 0.62 && (s === 0 || s === 11)) this.bassNote(t, 55, 0.3, 0.7);
      if (I > 0.85 && s % 2 === 1) this.clave(t, 0.06);
    }
  },

  /* --- contact and event stings --- */
  bat(kind) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (kind === 'middle') {             // chunky: a click over a low thud
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(110, t + 0.09);
      g.gain.setValueAtTime(0.75, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.22);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.06);
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.2;
      const g2 = this.ctx.createGain();
      g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      s.connect(f); f.connect(g2); g2.connect(this.sfxGain); s.start(t); s.stop(t + 0.08);
    } else if (kind === 'edge') {        // thin and high
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.08);
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2600;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t); s.stop(t + 0.11);
    } else {                             // miss: air, then the keeper's gloves
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.25);
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(280, t + 0.2);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t); s.stop(t + 0.24);
    }
  },
  sting(kind) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (kind === 'wicket') {
      [0, 0.09, 0.18].forEach((d, i) => this.conga(t + d, 260 - i * 60, 0.4));
      this.crowd(0.3, 2.2);
    } else if (kind === 'duck') {        // short, comic, dry
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(300, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.5);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.6);
    } else if (kind === 'four' || kind === 'six') {
      this.crowd(kind === 'six' ? 0.42 : 0.3, kind === 'six' ? 2.4 : 1.8);
      const base = kind === 'six' ? [392, 523, 659] : [330, 440];
      base.forEach((f, i) => this.bassNote(t + i * 0.08, f, 0.16, 0.3));
    } else if (kind === 'flourish') {
      [523, 659, 784, 1047].forEach((f, i) => this.bassNote(t + i * 0.05, f, 0.18, 0.35));
      this.crowd(0.5, 2.6);
    }
  },
  /* A rising note while the ball is in the air, resolving either way. */
  travel(startPitch) {
    if (!this.ctx || this.travelOsc) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(startPitch || 220, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.08, t + 0.1);
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
    o.connect(f); f.connect(g); g.connect(this.sfxGain); o.start(t);
    this.travelOsc = o; this.travelGain = g;
  },
  travelTo(pitch) {
    if (!this.travelOsc) return;
    this.travelOsc.frequency.setTargetAtTime(pitch, this.ctx.currentTime, 0.08);
  },
  travelEnd() {
    if (!this.travelOsc) return;
    const t = this.ctx.currentTime;
    this.travelGain.gain.setTargetAtTime(0.0001, t, 0.05);
    this.travelOsc.stop(t + 0.3);
    this.travelOsc = null; this.travelGain = null;
  },
};

/* ===================== CAMERA & PROJECTION =====================
   Behind the batter, looking down the pitch at the bowler. Line and length
   separate cleanly in this view and the off side sits on the right of the
   screen, which is what the fixed side-on camera could never do.

   World axes are unchanged: x runs down the pitch (0 = bowler's stumps), z
   across it (+z is the off side for a right-hander), y is height. The camera
   flips ends when you bowl — `dir` is which way it looks, and z mirrors with
   it so the off side stays the off side. */
const PPM = 30;                          // reference pixels per metre
const HORIZON = 0.335;                   // fraction of VH

const VIEW = {
  // The strip stays centred and the batter stands off it, so his body never
  // sits on top of the bowler you are trying to read.
  bat:  { x: 27.0, y: 3.30, z: 0, f: 860, dir: -1 },
  bowl: { x: -9.0, y: 3.60, z: 0, f: 860, dir:  1 },
};

const Cam = {
  x: 27.0, y: 3.30, z: 0, f: 860, dir: -1,
  tx: 27.0, ty: 3.30, tz: 0, tf: 860,
  shake: 0, shakeX: 0, shakeY: 0,

  use(v, snap) {
    this.tx = v.x; this.ty = v.y; this.tz = v.z; this.tf = v.f; this.dir = v.dir;
    if (snap) { this.x = v.x; this.y = v.y; this.z = v.z; this.f = v.f; }
  },
  push(f) { this.tf = f; },
  update(dt) {
    const k = 1 - Math.pow(0.0025, dt);
    this.x = lerp(this.x, this.tx, k);
    this.y = lerp(this.y, this.ty, k);
    this.z = lerp(this.z, this.tz, k);
    this.f = lerp(this.f, this.tf, k);
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.6);
      this.shakeX = (Math.random() * 2 - 1) * this.shake * 20;
      this.shakeY = (Math.random() * 2 - 1) * this.shake * 15;
    } else { this.shakeX = this.shakeY = 0; }
  },
  kick(a) { this.shake = Math.min(1.3, this.shake + a); },
};

/* Straight pinhole. `s` is scaled so that s * PPM is pixels-per-metre at
   that depth, which is what every drawing routine already expects. */
function proj(x, y, z) {
  const d = Cam.dir < 0 ? (Cam.x - x) : (x - Cam.x);
  if (d < 0.45) return { x: 0, y: 0, s: 0, d: d, behind: true };
  const k = Cam.f / d;
  return {
    x: VW / 2 + (Cam.dir < 0 ? 1 : -1) * (z - Cam.z) * k + Cam.shakeX,
    y: VH * HORIZON + (Cam.y - y) * k + Cam.shakeY,
    s: k / PPM, d: d, behind: false,
  };
}

/* Screen bearing of a shot direction, for the fan drawn around the batter:
   straight is up, the off side swings to the right, leg to the left. */
function shotBearing(angDeg) { return deg(-90 - angDeg * Cam.dir * -1); }

/* ===================== ART =====================
   Roughly eight shapes per figure: single-weight limbs, a filled circle for
   a head, no face. Chunkier torso and wider stance than the genre default.
   The figures never gain fidelity between tiers — everything earned is
   expressed in the world around them. */
let ctx = null;

const Art = {
  line(a, b, w, colour) {
    ctx.strokeStyle = colour; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  },
  disc(p, r, colour) {
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill();
  },
  poly(pts, colour) {
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fill();
  },
  text(str, x, y, size, colour, align, weight) {
    ctx.font = (weight || '900') + ' ' + size + 'px "Arial Black", Impact, sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = colour;
    ctx.fillText(str, x, y);
  },
  shadow(x, z, r, alpha) {
    const p = proj(x, 0, z);
    if (p.behind) return;
    ctx.fillStyle = 'rgba(0,0,0,' + (alpha || 0.22) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r * p.s * PPM, r * p.s * PPM * 0.34, 0, 0, 6.2832);
    ctx.fill();
  },
};

/* A stick figure. `pose` carries limb angles in degrees; the caller supplies
   only what it wants to move and the defaults cover the rest. */
function drawFigure(x, z, opt) {
  const o = Object.assign({
    face: -1, shirt: PAL.maroon, pads: false, bat: false, cap: 'helmet',
    lean: 0, armF: 40, armB: -30, legF: 22, legB: -22, crouch: 0,
    height: 1.82, batAng: -40, scale: 1, alpha: 1,
  }, opt);
  const g = proj(x, 0, z);
  if (g.behind || g.s <= 0) return null;
  const u = g.s * PPM * o.scale;         // pixels per metre for this figure
  const H = o.height * u;
  const dir = o.face;
  ctx.globalAlpha = o.alpha;

  const hipY = g.y - H * 0.50 + o.crouch * u * 0.12;
  const hip = { x: g.x + o.lean * u * 0.06, y: hipY };
  const shoulder = { x: hip.x + o.lean * u * 0.10, y: hipY - H * 0.30 };
  const headR = H * 0.075;
  const head = { x: shoulder.x + o.lean * u * 0.05 + dir * H * 0.015, y: shoulder.y - headR * 1.5 };
  const lw = Math.max(1.6, u * 0.055);

  const limb = (from, ang, len) => ({
    x: from.x + Math.sin(deg(ang)) * len * dir,
    y: from.y + Math.cos(deg(ang)) * len,
  });
  // hips sit a leg's length above the ground so the feet land on it
  hip.y = g.y - H * 0.455 + o.crouch * u * 0.12;
  shoulder.y = hip.y - H * 0.30;
  head.y = shoulder.y - headR * 1.5;

  // legs (front leg leads toward `face`)
  const kneeF = limb(hip, o.legF, H * 0.24);
  const footF = limb(kneeF, o.legF * 0.3, H * 0.24);
  const kneeB = limb(hip, o.legB, H * 0.24);
  const footB = limb(kneeB, o.legB * 0.3, H * 0.24);
  const legCol = o.pads ? PAL.white : o.shirt;
  Art.line(hip, kneeF, lw * (o.pads ? 2.2 : 1), legCol);
  Art.line(kneeF, footF, lw * (o.pads ? 2.2 : 1), legCol);
  Art.line(hip, kneeB, lw * (o.pads ? 2.0 : 1), legCol);
  Art.line(kneeB, footB, lw * (o.pads ? 2.0 : 1), legCol);

  // torso — one colour block, chunkier than the genre default
  ctx.fillStyle = o.shirt;
  ctx.beginPath();
  ctx.moveTo(shoulder.x - u * 0.20, shoulder.y);
  ctx.lineTo(shoulder.x + u * 0.20, shoulder.y);
  ctx.lineTo(hip.x + u * 0.15, hip.y);
  ctx.lineTo(hip.x - u * 0.15, hip.y);
  ctx.closePath(); ctx.fill();

  // arms
  const elbowB = limb(shoulder, o.armB, H * 0.19);
  const handB = limb(elbowB, o.armB * 0.6, H * 0.18);
  const elbowF = limb(shoulder, o.armF, H * 0.19);
  const handF = limb(elbowF, o.armF * 0.6, H * 0.18);
  Art.line(shoulder, elbowB, lw, o.shirt);
  Art.line(elbowB, handB, lw, o.shirt);

  // bat: a flat trapezoid hung off the hands
  if (o.bat) {
    const a = deg(o.batAng);
    const bx = Math.sin(a) * dir, by = Math.cos(a);
    const gripX = handF.x, gripY = handF.y;
    const bl = H * 0.42, bw = H * 0.045;
    const tipX = gripX + bx * bl, tipY = gripY + by * bl;
    const px = -by * dir, py = bx * dir;
    Art.poly([
      { x: gripX + px * bw * 0.5, y: gripY + py * bw * 0.5 },
      { x: tipX + px * bw, y: tipY + py * bw },
      { x: tipX - px * bw, y: tipY - py * bw },
      { x: gripX - px * bw * 0.5, y: gripY - py * bw * 0.5 },
    ], '#d9b877');
  }
  Art.line(shoulder, elbowF, lw, o.shirt);
  Art.line(elbowF, handF, lw, o.shirt);

  // head, then cap or helmet — the two-shape silhouette read from across the room
  Art.disc(head, headR, '#2a2118');
  if (o.cap === 'cap') {
    ctx.fillStyle = o.shirt === PAL.maroon ? PAL.gold : PAL.maroon;
    ctx.beginPath();
    ctx.arc(head.x, head.y, headR * 1.08, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(head.x + (dir < 0 ? -headR * 2.1 : 0), head.y - headR * 0.16, headR * 2.1, headR * 0.34);
  } else if (o.cap === 'helmet') {
    ctx.fillStyle = '#2f3d4a';
    ctx.beginPath();
    ctx.arc(head.x, head.y, headR * 1.22, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    ctx.strokeStyle = '#cfd6dc'; ctx.lineWidth = Math.max(1.2, u * 0.03);
    ctx.beginPath();
    ctx.moveTo(head.x + dir * headR * 1.2, head.y - headR * 0.1);
    ctx.lineTo(head.x + dir * headR * 1.5, head.y + headR * 0.85);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  return { head, shoulder, hip, handF, footF, u };
}

/* --- the ground --- */
/* From behind the stumps most of the boundary is in front of the camera and
   the rest is behind it, so the outfield is painted as the region inside the
   rope rather than as a closed ellipse. Points that fall behind the lens are
   dropped and the path closes off-screen, well below the bottom edge. */
function groundFill(radius, colour) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const a = -Math.PI + (i / 96) * Math.PI * 2;
    const wx = PITCH_LEN / 2 + Math.cos(a) * radius;
    const wz = Math.sin(a) * radius;
    const q = proj(wx, 0, wz);
    if (!q.behind) pts.push(q);
  }
  if (pts.length < 3) return null;
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fill();
  return pts;
}

function quad(a, b, c, d, colour) {
  if (a.behind || b.behind || c.behind || d.behind) return;
  Art.poly([a, b, c, d], colour);
}

function drawGround(tier) {
  const hz = VH * HORIZON;
  const sky = ctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, PAL.skyHi);
  sky.addColorStop(1, PAL.sky);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, hz + 2);

  // everything past the rope: a dirt road and the sea at club level, a
  // painted picket and a stand above it
  ctx.fillStyle = tier.key === 'club' ? '#7d8f5a' : '#5b6f7d';
  ctx.fillRect(0, hz, VW, VH - hz);

  const rope = groundFill(boundaryR(), PAL.grass);
  if (rope) {
    ctx.strokeStyle = PAL.white;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(rope[0].x, rope[0].y);
    for (let i = 1; i < rope.length; i++) ctx.lineTo(rope[i].x, rope[i].y);
    ctx.stroke();
  }
  groundFill(boundaryR() * 0.52, PAL.grassDark);

  // the square, then the strip
  quad(proj(-3, 0, -4.6), proj(PITCH_LEN + 3, 0, -4.6),
       proj(PITCH_LEN + 3, 0, 4.6), proj(-3, 0, 4.6), PAL.grassLight);
  quad(proj(-1.5, 0, -PITCH_HALF_W), proj(PITCH_LEN + 1.5, 0, -PITCH_HALF_W),
       proj(PITCH_LEN + 1.5, 0, PITCH_HALF_W), proj(-1.5, 0, PITCH_HALF_W), PAL.pitch);

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  [CREASE_X, PITCH_LEN, PITCH_LEN - CREASE_X, 0].forEach(cx => {
    const a = proj(cx, 0, -PITCH_HALF_W), b = proj(cx, 0, PITCH_HALF_W);
    if (a.behind || b.behind) return;
    ctx.lineWidth = Math.max(1, 2 * a.s);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
}

function drawCrowd(tier) {
  const density = tier.key === 'club' ? 60 : 190;
  const R = boundaryR() + 9;
  for (let i = 0; i < density; i++) {
    const a = -Math.PI + (i / density) * Math.PI * 2 + 0.13;
    const rr = R + (i % 3) * 3.2;
    const q = proj(PITCH_LEN / 2 + Math.cos(a) * rr, 0, Math.sin(a) * rr);
    if (q.behind || q.y < VH * HORIZON - 6 || q.y > VH + 40 || q.x < -60 || q.x > VW + 60) continue;
    const r = Math.max(1.2, 0.30 * q.s * PPM);
    ctx.fillStyle = 'hsl(' + ((i * 47) % 360) + ',62%,' + (tier.key === 'club' ? 56 : 46) + '%)';
    ctx.beginPath(); ctx.arc(q.x, q.y - r * 1.6, r, 0, 6.2832); ctx.fill();
    ctx.fillRect(q.x - r * 0.8, q.y - r * 0.7, r * 1.6, r * 1.9);
  }
}

function drawStumps(x, isStriker) {
  const w = 0.11;
  for (let i = -1; i <= 1; i++) {
    const base = proj(x, 0, i * w), top = proj(x, STUMP_H, i * w);
    if (base.behind || top.behind) continue;
    Art.line(base, top, Math.max(1.4, 3.2 * base.s), PAL.white);
  }
  if (isStriker) {
    const b1 = proj(x, STUMP_H, -w * 0.5), b2 = proj(x, STUMP_H, w * 0.5);
    if (!b1.behind && !b2.behind) Art.line(b1, b2, Math.max(1, 2 * b1.s), '#e2ddcf');
  }
}

/* ===================== THE BALL =====================
   One projectile with one bounce. Which band a bowler hits decides where it
   pitches and how much of its downward speed survives — that pairing alone
   produces a short ball that climbs and a yorker that stays under the bat. */
const Ball = {
  x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
  live: false, bounced: false, hit: false, rolling: false,
  landed: false, airT: 0, hangT: 0, liveT: 0, catchChecked: false,
  spin: 0, trail: [],

  deliver(d) {
    this.x = RELEASE_X; this.y = RELEASE_Y; this.z = d.releaseZ;
    this.vx = d.pace;
    const t1 = (d.pitchX - RELEASE_X) / d.pace;
    this.vy = (0.5 * G * t1 * t1 - RELEASE_Y) / t1;
    // Aim the release so the ball still lands on its mark despite the swing:
    // the path deceives, the pitch mark stays honest.
    const sw = d.swingAcc || 0;
    this.vz = (d.pitchZ - d.releaseZ - 0.5 * sw * t1 * t1) / t1;
    this.live = true; this.bounced = false; this.hit = false; this.rolling = false;
    this.landed = false; this.airT = 0; this.hangT = 0; this.catchChecked = false;
    this.seamKick = d.seamKick || 0;
    this.swingAcc = d.swingAcc || 0;
    this.rest = d.rest;
    this.trail.length = 0;
    this.spin = 0;
  },

  /* Where will it be when it reaches the bat? Run the same maths forward so
     the timing window and the length marker agree with what actually
     happens — no hidden dice anywhere in the chain. */
  predict(d) {
    const t1 = (d.pitchX - RELEASE_X) / d.pace;
    const vy0 = (0.5 * G * t1 * t1 - RELEASE_Y) / t1;
    const tc = (CONTACT_X - RELEASE_X) / d.pace;
    let y, tBounce = t1;
    if (tc <= t1) {                       // arrives before pitching (yorker)
      y = RELEASE_Y + vy0 * tc - 0.5 * G * tc * tc;
      tBounce = null;
    } else {
      const vyB = (vy0 - G * t1) * -d.rest;
      const dt = tc - t1;
      y = vyB * dt - 0.5 * G * dt * dt;
    }
    const z = d.pitchZ + (tBounce === null ? 0 : d.seamKick * (tc - t1));
    return { t: tc, y: Math.max(0, y), z, tBounce };
  },

  step(dt) {
    if (!this.live) return;
    // Swing acts only while the ball is in the air and still on the bowler's
    // terms; once it pitches, the seam takes over.
    if (!this.bounced && !this.hit) this.vz += this.swingAcc * dt;
    if (this.hit) this.liveT += dt;
    if (this.hit && this.y > 0.12 && !this.rolling) this.airT += dt;
    this.x += this.vx * dt;
    this.z += this.vz * dt;
    this.y += this.vy * dt;
    this.vy -= G * dt;
    if (this.y <= 0.036) {
      if (!this.bounced && !this.hit) {
        this.bounced = true;
        this.y = 0.036;
        this.vy = -this.vy * this.rest;
        this.vz += this.seamKick;         // nip off the seam
        this.vx *= 0.86;
      } else {
        if (this.hit && !this.landed) { this.landed = true; this.hangT = this.airT; }
        this.y = 0.036;
        if (Math.abs(this.vy) > 1.2) {
          this.vy = -this.vy * 0.42;
          this.vx *= CFG.bounceKeep; this.vz *= CFG.bounceKeep;
        } else {
          this.vy = 0; this.rolling = true;
          const f = Math.pow(CFG.outfield, dt);   // outfield friction
          this.vx *= f; this.vz *= f;
        }
      }
    }
    this.spin += dt * 26;
    this.trail.push({ x: this.x, y: this.y, z: this.z });
    if (this.trail.length > 22) this.trail.shift();
  },

  speed() { return Math.hypot(this.vx, this.vz); },
  distFromCentre() { return Math.hypot(this.x - PITCH_LEN / 2, this.z); },

  draw() {
    if (!this.live) return;
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i], a = i / this.trail.length;
      const p = proj(t.x, t.y, t.z);
      ctx.globalAlpha = a * 0.5;
      Art.disc(p, Math.max(1, 0.055 * p.s * PPM * a), this.hit ? PAL.gold : PAL.ball);
    }
    ctx.globalAlpha = 1;
    const p = proj(this.x, this.y, this.z);
    const r = Math.max(2.2, 0.072 * p.s * PPM);
    Art.disc(p, r, PAL.ball);
    // the seam: with no faces and no fingers, this white stripe on a red
    // circle is one of the only moving details there is to read.
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(this.spin);
    ctx.strokeStyle = PAL.white; ctx.lineWidth = Math.max(1, r * 0.3);
    ctx.beginPath(); ctx.moveTo(-r * 0.9, 0); ctx.lineTo(r * 0.9, 0); ctx.stroke();
    ctx.restore();
  },
};

/* ===================== THE FIELD =====================
   Positions are (angle from straight, radius). At club level it is a ring
   regardless of what you do. From island senior the field responds — and
   the Dossier stub puts a man where you have actually been scoring. */
const RING = [
  { a: -125, r: 26 }, { a: -78, r: 30 }, { a: -40, r: 32 }, { a: -12, r: 34 },
  { a: 26, r: 32 }, { a: 62, r: 30 }, { a: 100, r: 28 }, { a: 148, r: 30 },
];

function buildField(tier, dossier) {
  const f = RING.map(p => ({
    a: p.a + rnd(-5, 5),
    r: p.r * tier.fieldSpread + rnd(-2, 2),
    react: 0, x: 0, z: 0,
  }));
  if (tier.dossier && dossier) {
    // Your best scoring zone gets a fielder. Diversify or wear it.
    let best = 0;
    for (let i = 1; i < dossier.length; i++) if (dossier[i] > dossier[best]) best = i;
    if (dossier[best] >= 3) {
      f[0].a = SHOTS[best].ang + rnd(-6, 6);
      f[0].r = 34;
      f[0].flagged = true;
    }
  }
  f.forEach(p => {
    p.x = CONTACT_X - Math.cos(deg(p.a)) * p.r;
    p.z = -Math.sin(deg(p.a)) * p.r;
  });
  f.push({ a: 180, r: 2.4, x: PITCH_LEN + 1.6, z: 0, keeper: true });
  f.forEach(q => { q.px = q.x; q.pz = q.z; });
  return f;
}

function drawField(field, tier, shirt) {
  const order = field.slice().sort((a, b) => proj(b.px, 0, b.pz).d - proj(a.px, 0, a.pz).d);
  order.forEach(p => {
    if (p.keeper) {
      if (Cam.dir > 0) {                 // only from the bowler's end
        Art.shadow(p.px, p.pz, 0.42, 0.18);
        drawFigure(p.px, p.pz, { face: -1, shirt, crouch: 1, legF: 46, legB: -46,
                                 armF: 60, armB: 50, cap: 'cap', scale: 0.95 });
      }
      return;
    }
    const bob = Math.sin(now() * 1.6 + p.a) * 4;
    Art.shadow(p.px, p.pz, 0.42, 0.18);
    drawFigure(p.px, p.pz, {
      face: p.px > CONTACT_X ? 1 : -1, shirt, cap: 'cap',
      armF: 18 + bob, armB: -14 - bob, legF: 16, legB: -16, scale: 0.95,
    });
    if (p.flagged) {                       // the Dossier's man, marked
      const q = proj(p.px, 2.6, p.pz);
      if (!q.behind) Art.text('!', q.x, q.y, Math.max(10, 22 * q.s), PAL.gold);
    }
  });
}

/* ===================== SHOT RESOLUTION =====================
   Stats never roll outcomes. They set window width and deviation cone size;
   the input decides everything else. 70/30 input-to-stats at club level. */
function timingWindows(mods) {
  const w = mods.widen || 1;
  return { middle: WIN.middle * w, good: WIN.good * w, edge: WIN.edge * w };
}

function shotAppropriate(shot, contactY, bandKey) {
  const hOk = contactY >= shot.likeH[0] - 0.2 && contactY <= shot.likeH[1] + 0.2;
  const lOk = shot.likeLen.indexOf(bandKey) >= 0;
  if (hOk && lOk) return 1.0;
  if (hOk || lOk) return 0.82;
  return 0.62;
}

/* Turn a swing into a struck ball: quality from timing, direction from the
   chosen zone plus a deviation cone, power from the shot type. Then the ball
   is simply let go and the field deals with it — no scripted results. */
function playShot(o) {
  const { shot, quality, power, angleDeg, lift, contactY } = o;
  const a = deg(angleDeg);
  const speed = power;
  const vFlat = speed * Math.cos(lift);
  Ball.hit = true;
  Ball.bounced = true;                  // a struck ball is done with the pitch
  Ball.rolling = false;
  Ball.x = CONTACT_X; Ball.y = Math.max(0.25, contactY);
  Ball.vx = -Math.cos(a) * vFlat;
  Ball.vz = -Math.sin(a) * vFlat;
  Ball.vy = speed * Math.sin(lift);
  Ball.rest = 0.42;
  Ball.seamKick = 0;
  Ball.landed = false; Ball.airT = 0; Ball.hangT = 0; Ball.liveT = 0; Ball.catchChecked = false;
  Ball.trail.length = 0;
  return quality;
}

/* Watch a struck ball until something happens to it. Called every frame. */
const fieldSpeed = () => (M && M.tier && M.tier.fieldSpeed) || 6.2;
const FIELD_REACT = 0.35;
const THROW_SPEED = 27;
const RUN_FIRST = 2.3, RUN_AGAIN = 2.8;  // seconds to complete a run

/* How many runs a struck ball is worth, from the clock rather than from its
   distance: who gets to it, how long that takes them, and how long the throw
   back takes. A ball that beats the ring is worth two or three because
   nobody can cut it off, not because it travelled some magic number of
   metres. */
function runsFromClock(tIntercept, ix, iz) {
  const back = tIntercept + 0.45 + Math.hypot(ix - PITCH_LEN, iz) / THROW_SPEED;
  let t = 0, runs = 0;
  for (let i = 0; i < 3; i++) {
    t += i === 0 ? RUN_FIRST : RUN_AGAIN;
    if (t <= back) runs++; else break;
  }
  return runs;
}

/* Who can be first to the ball, given they only start moving on contact. */
function firstToBall(field) {
  const t = Ball.liveT;
  if (t < FIELD_REACT) return null;
  // You cannot cut off a ball travelling at you at speed the way you walk in
  // on a gentle one — the faster it is going, the narrower the window to be
  // in its path at all.
  const speedFactor = clamp(1.15 - Ball.speed() / 26, 0.40, 1);
  const reach = fieldSpeed() * (t - FIELD_REACT) * speedFactor;
  let best = null, bestD = 1e9;
  for (const p of field) {
    const d = Math.hypot(Ball.x - p.x, Ball.z - p.z);
    if (d <= reach && d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function resolveTravel(field, opts) {
  // The rope first: a ball already past it is never a catch and never a run.
  if (Ball.distFromCentre() >= boundaryR()) {
    return { type: Ball.y > 0.4 && !Ball.rolling ? 'six' : 'four' };
  }
  // A flat ball straight at someone, chest high. A middled drive stays under
  // this, which is the whole point.
  if (!Ball.rolling && Ball.y > 0.9 && Ball.y < 2.7) {
    for (const p of field) {
      if (p.keeper) continue;
      if (Math.hypot(Ball.x - p.x, Ball.z - p.z) < 2.0 + (opts.sharpCatching ? 0.4 : 0)) {
        return { type: 'caught', by: p };
      }
    }
  }
  // Anything lofted is decided where it lands: the longer it hung up there,
  // the further someone had to come to be under it.
  if (Ball.landed && !Ball.catchChecked) {
    Ball.catchChecked = true;
    const reach = 2.2 + Ball.hangT * 3.4 + (opts.sharpCatching ? 0.6 : 0);
    for (const p of field) {
      if (p.keeper) continue;
      if (Math.hypot(Ball.x - p.x, Ball.z - p.z) < reach) return { type: 'caught', by: p };
    }
  }
  // The keeper only takes what carries — a nick that dies at his feet is a
  // play and a miss, not a wicket.
  if (opts.edged && Ball.x > PITCH_LEN + 0.6 && Ball.x < PITCH_LEN + 3.4
      && Math.abs(Ball.z) < 2.6 && Ball.y > 0.25 && Ball.y < 2.4 && !Ball.rolling) {
    return { type: 'caughtBehind' };
  }
  // Otherwise it is a race between the ball and the nearest fielder.
  const chaser = firstToBall(field);
  if (chaser) {
    return { type: 'runs', runs: runsFromClock(Ball.liveT, Ball.x, Ball.z), by: chaser };
  }
  // Nobody near it and it has stopped: they walk over and the batters run.
  if (Ball.rolling && Ball.speed() < 1.2) {
    return { type: 'runs', runs: runsFromClock(Ball.liveT + 1.4, Ball.x, Ball.z) };
  }
  return null;
}

/* Move whoever is closest toward the ball, so the chase is visible. */
function chaseBall(field, dt) {
  if (!Ball.hit || !Ball.live) return;
  let best = null, bestD = 1e9;
  for (const p of field) {
    const d = Math.hypot(Ball.x - p.px, Ball.z - p.pz);
    if (d < bestD) { bestD = d; best = p; }
  }
  if (!best || bestD < 0.4 || Ball.liveT < FIELD_REACT) return;
  const step = Math.min(bestD, fieldSpeed() * dt);
  best.px += (Ball.x - best.px) / bestD * step;
  best.pz += (Ball.z - best.pz) / bestD * step;
}

/* ===================== TUNING =====================
   The numbers the whole feel hangs off, in one place. The outfield is fast
   and the bottom tier is deliberately generous: arcade cricket dies when the
   honest default is a defensive push. */
const CFG = {
  swingSpeed: { control: 13.0, attack: 26.0, slog: 32.0 },
  qualityMult: { middle: 1.0, good: 0.74, edge: 0.40 },
  /* Middling one keeps it down; mistiming it puts it up. Loft is what gets
     you caught, so it must come from the shot you chose and the timing you
     missed — never from playing well. */
  typeLift: { control: 0.35, attack: 0.60, slog: 1.90 },
  qualityLift: { middle: 0.55, good: 1.15, edge: 2.60 },
  cone: { middle: 5, good: 13, edge: 38 },      // degrees, one sigma
  typeWiden: { control: 1.26, attack: 1.0, slog: 0.74 },
  backliftWiden: 0.22,
  outfield: 0.66,                                // velocity kept per second
  bounceKeep: 0.88,
  capSwagger: 1.42,                              // cap builds Swagger faster
  flourishBonus: 1.22,
  runupTime: { short: 0.85, long: 1.45 },
};

/* ===================== INPUT ===================== */
const Input = {
  x: 0, y: 0, down: false, downT: 0, ox: 0, oy: 0,
  taps: [], releases: [], keys: {}, anyKey: false,
  init(canvas) {
    const pt = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches && e.touches[0] ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) / r.width * VW,
        y: (t.clientY - r.top) / r.height * VH,
      };
    };
    const down = e => {
      e.preventDefault();
      const p = pt(e);
      this.x = p.x; this.y = p.y; this.ox = p.x; this.oy = p.y;
      this.down = true; this.downT = now();
      Snd.boot(); Snd.resume();
    };
    const move = e => { const p = pt(e); this.x = p.x; this.y = p.y; };
    const up = e => {
      e.preventDefault();
      if (!this.down) return;
      const held = now() - this.downT;
      this.down = false;
      this.releases.push({ x: this.x, y: this.y, ox: this.ox, oy: this.oy, t: now(), held: held });
      if (held < 0.30 && Math.hypot(this.x - this.ox, this.y - this.oy) < 26) {
        this.taps.push({ x: this.x, y: this.y, t: now() });
      }
    };
    canvas.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    canvas.addEventListener('touchstart', down, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); move(e); }, { passive: false });
    canvas.addEventListener('touchend', up, { passive: false });
    canvas.addEventListener('touchcancel', up, { passive: false });
    window.addEventListener('keydown', e => {
      if (this.keys[e.code]) return;
      this.keys[e.code] = true; this.anyKey = true;
      this.keyDownT = this.keyDownT || {};
      this.keyDownT[e.code] = now();
      Snd.boot(); Snd.resume();
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.code === 'KeyM') Snd.toggle();
    });
    window.addEventListener('keyup', e => {
      this.keys[e.code] = false;
      if (e.code === 'Space' && this.keyDownT && this.keyDownT.Space) {
        const held = now() - this.keyDownT.Space;
        this.releases.push({ x: this.x, y: this.y, ox: this.ox, oy: this.oy, t: now(), held: held, key: true });
        this.keyDownT.Space = 0;
      }
    });
  },
  /* True while a swing is being charged, from either input. */
  charging() { return this.down || !!this.keys.Space; },
  chargeStart() {
    if (this.down) return this.downT;
    if (this.keys.Space && this.keyDownT) return this.keyDownT.Space;
    return 0;
  },
  takeTap() { return this.taps.shift(); },
  takeRelease() { return this.releases.shift(); },
  flush() { this.taps.length = 0; this.releases.length = 0; },
};

function shotScreenAngle(i) { return shotBearing(SHOTS[i].ang); }
function zoneFromAngle(ang) {
  let best = 2, bd = 99;
  for (let i = 0; i < 6; i++) {
    let d = Math.abs(((shotScreenAngle(i) - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
/* The aim: a virtual stick from wherever the thumb landed, so the whole
   scheme is one thumb anywhere on the screen. */
function readAim(fallback) {
  for (let i = 0; i < 6; i++) if (Input.keys['Digit' + (i + 1)]) return i;
  if (Input.down) {
    const dx = Input.x - Input.ox, dy = Input.y - Input.oy;
    if (Math.hypot(dx, dy) > 26) return zoneFromAngle(Math.atan2(dy, dx));
    return fallback;
  }
  if (!('ontouchstart' in window)) {
    const b = proj(CONTACT_X, 0.9, 0);
    const dx = Input.x - b.x, dy = Input.y - b.y;
    if (Math.hypot(dx, dy) > 60) return zoneFromAngle(Math.atan2(dy, dx));
  }
  return fallback;
}

/* ===================== MATCH STATE ===================== */
const M = {
  tier: TIERS[0], mode: 'match', phase: 'bat',
  gear: 'helmet',
  swagger: 0, hostility: 0,
  dossier: [0, 0, 0, 0, 0, 0],
  bat: null, bowl: null, field: null,
  msg: '', msgT: 0, msgBig: false,
  hitstop: 0, flash: 0,
  bowlerMood: 0,          // >0 he is rattled, <0 he is on top
  batterConf: 0.5,
  reset(tier, mode) {
    this.tier = tier; this.mode = mode;
    this.phase = mode === 'bowlPractice' ? 'bowl' : 'bat';
    this.swagger = 0; this.hostility = 0;
    this.dossier = [0, 0, 0, 0, 0, 0];
    this.gear = 'helmet';
    this.bowlerMood = 0; this.batterConf = 0.5;
    this.bat = {
      runs: 0, balls: 0, fours: 0, sixes: 0, out: false, howOut: '',
      overs: mode === 'batPractice' ? 99 : 5, ballsFaced: 0, teamRuns: 0, target: 0,
      bestShot: '', dots: 0,
    };
    this.bowl = {
      overs: mode === 'bowlPractice' ? 99 : 5, balls: 0, runs: 0, wickets: 0,
      maxWickets: 10, corridor: 0,
      lastBands: [], target: 0,
    };
    this.field = buildField(tier, null);
    this.track = [];
    Bowl.bowler = pick(BOWLERS); Bowl.vi = 0;
    Bowl.tx = 16.4; Bowl.tz = 0.35;
    this.msg = ''; this.msgT = 0;
  },
  say(text, big) { this.msg = text; this.msgT = now(); this.msgBig = !!big; },
};

/* ===================== BATTING =====================
   One gesture does everything. Press and release: the release is your
   timing, how long you held is your intent, and where you dragged is your
   zone. Press before the bowler lets go and you have raised your backlift —
   a wider window for having shown your hand. */
const Bat = {
  phase: 'ready', t: 0, d: null, pred: null,
  zone: 2, swung: false, swingInfo: null, contactT: 0,
  earlyHold: false, backlift: 0, marker: null, outcome: null,
  ghost: null, flourish: false, lastBackliftZone: -1,

  nextBall() {
    const T = M.tier;
    this.phase = 'ready'; this.t = 0; this.swung = false;
    this.outcome = null; this.ghost = null; this.flourish = false;
    this.earlyHold = false; this.backlift = 0;
    this.marker = null;
    Input.flush();

    // A new bowler at the top of every over, so the innings keeps changing
    // shape: a wrist spinner one over and a genuine quick the next.
    if (!this.bowler || M.bat.balls % 6 === 0) {
      const was = this.bowler;
      do { this.bowler = pick(BOWLERS); } while (was && this.bowler === was);
      M.say(this.bowler.name, false);
    }
    const B = this.bowler;

    // The bowler picks. High Swagger degrades his accuracy — this is a
    // batter making good bowlers bowl badly, and it is the only real
    // counter the player has to a field that has worked them out.
    const pressure = M.swagger * 0.55;
    const wayward = T.wayward * (1 + pressure);
    const v = pick(B.vars);
    let band = bandByKey(v.band);
    if (Math.random() < 0.45) {          // he does not hit his length every ball
      const i = clamp(BANDS.indexOf(band) + (Math.random() < 0.5 ? -1 : 1), 0, 4);
      if (BANDS.indexOf(band) >= 0) band = BANDS[i];
    }
    // From island senior he reads a raised backlift and changes his length.
    if (T.liveField && this.lastBackliftZone >= 0 && BANDS.indexOf(band) >= 0) {
      const shift = SHOTS[this.lastBackliftZone].likeLen.indexOf('short') >= 0 ? 1 : -1;
      band = BANDS[clamp(BANDS.indexOf(band) + shift, 0, 4)];
    }
    const lineZ = clamp(randn() * (0.42 + wayward * 0.6) + 0.10, -1.5, 1.7);
    const pace = rnd(B.pace[0], B.pace[1]) * (v.paceMul || 1) * (1 - pressure * 0.05);

    this.variation = v;
    this.d = {
      pace: pace, pitchX: band.px + randn() * (0.42 + wayward * 0.75),
      pitchZ: lineZ, releaseZ: lineZ * 0.35 + 0.28,
      rest: band.rest * (v.bounceMul || 1),
      seamKick: (v.seam || 0) + randn() * (0.35 + wayward * 0.5),
      swingAcc: (v.swing || 0) * rnd(0.75, 1.15),
      band: band, bowler: B, variation: v,
    };
    this.d.pitchX = clamp(this.d.pitchX, 9.5, 20.0);
    this.pred = Ball.predict(this.d);
    this.runup = B.pace[1] > 18 ? CFG.runupTime.long : CFG.runupTime.short;
    M.field.forEach(f => { f.px = f.x; f.pz = f.z; });
    M.track = [];
    Ball.live = false;
    Cam.use(VIEW.bat, false);
  },

  update(dt) {
    this.t += dt;
    const T = M.tier;

    if (this.phase === 'ready') {
      if (this.t > 0.55) { this.phase = 'runup'; this.t = 0; }
      return;
    }

    if (this.phase === 'runup') {
      // Pressing before he lets go is the raised backlift: earlier
      // commitment, wider window, but you have shown your hand.
      if (Input.charging()) this.earlyHold = true;
      this.zone = readAim(this.zone);
      if (this.t >= this.runup) {
        Ball.deliver(this.d);
        this.releaseT = now();
        this.contactT = this.releaseT + this.pred.t;
        this.phase = 'flight'; this.t = 0;
        this.backlift = this.earlyHold ? 1 : 0;
        this.lastBackliftZone = this.earlyHold ? this.zone : -1;
        Input.flush();
      }
      return;
    }

    if (this.phase === 'flight') {
      Ball.step(dt);
      if (Ball.hit) { chaseBall(M.field, dt); trackBall(); }
      this.zone = readAim(this.zone);
      // Length marker: painted on the pitch, and it arrives later the higher
      // you climb. Information shrinks while the option set grows.
      if (this.pred.tBounce !== null) {
        const showAt = Math.max(0, this.pred.tBounce - T.markerLead);
        if (this.t >= showAt) this.marker = { x: this.d.pitchX, z: this.d.pitchZ };
      }
      const rel = Input.takeRelease();
      if (rel && !this.swung) { this.swing(rel); }
      else if (!this.swung && now() > this.contactT + 0.20) { this.swing(null); }
      if (this.swung && Ball.hit && this.outcome === null) {
        const r = resolveTravel(M.field, {
          sharpCatching: T.liveField,
          edged: this.swingInfo && this.swingInfo.quality === 'edge',
        });
        if (r) this.finish(r);
        Snd.travelTo(200 + Ball.distFromCentre() * 9);
      }
      if (!Ball.hit && Ball.x > PITCH_LEN + 4) this.finish({ type: 'through' });
      if (this.t > 9) this.finish({ type: 'runs', runs: runsFromClock(Ball.liveT, Ball.x, Ball.z) });
      return;
    }

    if (this.phase === 'result') {
      if (Ball.hit || Ball.live) { Ball.step(dt); if (Ball.hit) chaseBall(M.field, dt); }
      if (this.t > (this.outcome && this.outcome.wicket ? 2.6 : 1.5)) this.after();
    }
  },

  swing(rel) {
    this.swung = true;
    const T = M.tier;
    if (!rel) {                          // no shot offered
      this.judgeMiss(true);
      return;
    }
    const dt = rel.t - this.contactT;
    const type = this.earlyHold || rel.held > 0.42 ? 'slog'
               : rel.held < 0.15 ? 'control' : 'attack';
    const shot = SHOTS[this.zone];
    const approp = shotAppropriate(shot, this.pred.y, this.d.band.key);

    let widen = CFG.typeWiden[type] * (0.72 + approp * 0.34);
    // No helmet, and the short one is on you before you are ready.
    if (M.gear === 'cap' && (this.d.band.key === 'short' || this.d.band.key === 'bouncer')) widen *= 0.80;
    if (this.backlift) widen += CFG.backliftWiden;
    if (M.bat.balls < 2) widen += T.newBatter;      // new-batter window, tier-signed
    const w = timingWindows({ widen: widen });

    const err = Math.abs(dt);
    const quality = err < w.middle ? 'middle' : err < w.good ? 'good'
                  : err < w.edge ? 'edge' : 'air';

    // The flourish: full meter plus a premeditated release. Both the reward
    // and the way you get out.
    this.flourish = M.swagger >= 0.999 && type === 'slog';

    if (quality === 'air') { this.judgeMiss(false, dt); return; }

    let cone = CFG.cone[quality] * (type === 'slog' ? 1.5 : 1) * (2 - approp);
    if (this.flourish) cone *= quality === 'middle' ? 0.7 : 2.1;
    const angle = shot.ang + randn() * cone;
    let power = CFG.swingSpeed[type] * CFG.qualityMult[quality] * shot.power * approp;
    power *= 1 + M.swagger * 0.10;
    if (this.flourish) power *= CFG.flourishBonus;
    const lift = shot.lift * CFG.typeLift[type] * CFG.qualityLift[quality]
               + (quality === 'edge' ? rnd(0, 0.45) : 0);

    this.swingInfo = { type: type, quality: quality, err: dt, approp: approp };
    this.ghost = { intended: shot.ang, actual: angle };
    playShot({
      shot: shot, quality: quality, power: power, angleDeg: angle,
      lift: lift, contactY: this.pred.y,
    });
    Snd.bat(quality === 'edge' ? 'edge' : 'middle');
    if (quality === 'middle') {
      M.hitstop = 0.05; M.flash = 1; Cam.kick(this.flourish ? 0.9 : 0.5);
    } else if (quality === 'good') { M.hitstop = 0.028; Cam.kick(0.22); }
    Snd.travel(220);
  },

  /* Beaten, or a shot never offered. */
  judgeMiss(noShot, dt) {
    this.swingInfo = { type: 'miss', quality: 'miss', err: dt || 0 };
    Snd.bat('miss');
    M.bowlerMood = Math.max(-1, M.bowlerMood - 0.35);
  },

  finish(r) {
    if (this.outcome) return;
    Snd.travelEnd();
    const b = M.bat;
    b.balls++;
    const o = { wicket: false, runs: 0, label: '', how: '' };

    if (r.type === 'caught' || r.type === 'caughtBehind') {
      o.wicket = true; o.label = 'CAUGHT'; o.how = r.type === 'caughtBehind' ? 'c wk' : 'caught';
    } else if (r.type === 'six') {
      o.runs = 6; o.label = 'SIX'; b.sixes++;
    } else if (r.type === 'four') {
      o.runs = 4; o.label = 'FOUR'; b.fours++;
    } else if (r.type === 'runs') {
      o.runs = r.runs;
      o.label = r.runs === 0 ? 'DOT' : r.runs + (r.runs === 1 ? ' RUN' : ' RUNS');
    } else if (r.type === 'through') {
      // beaten, or left alone — did it hit the stumps?
      const hit = Math.abs(Ball.z) < STUMP_HALF_W + 0.05;
      const low = this.pred.y < STUMP_H + 0.12;
      if (hit && low) { o.wicket = true; o.label = 'BOWLED'; o.how = 'b'; }
      else if (low && Math.abs(this.pred.z) < 0.16 && this.swingInfo
               && this.swingInfo.quality === 'miss' && this.zone >= 3 && Math.random() < 0.45) {
        o.wicket = true; o.label = 'LBW'; o.how = 'lbw';
      } else { o.label = this.swingInfo && this.swingInfo.quality === 'miss' ? 'BEATEN' : 'DOT'; }
    }
    this.applyOutcome(o);
    this.outcome = o;
    this.phase = 'result'; this.t = 0;
    Cam.push(o.wicket ? 840 : VIEW.bat.f);
  },

  applyOutcome(o) {
    const b = M.bat;
    if (o.wicket) {
      b.out = true; b.howOut = o.how;
      M.swagger = 0;                     // it drops out the ball you get out
      M.say(b.runs === 0 ? 'GOLDEN DUCK' : o.label, true);
      Snd.sting(b.runs === 0 && b.balls <= 1 ? 'duck' : 'wicket');
      Cam.kick(0.7);
      return;
    }
    b.runs += o.runs;
    // Swagger builds on dominant strokeplay only — boundaries, and attacking
    // shots played to good balls. Milked singles build nothing.
    let gain = 0;
    const si = this.swingInfo;
    if (o.runs >= 6) gain = 0.30;
    else if (o.runs === 4) gain = 0.22;
    else if (si && si.quality === 'middle' && si.type !== 'control' && si.approp > 0.9) gain = 0.10;
    if (si && si.type !== 'control' && ['good', 'full', 'yorker'].indexOf(this.d.band.key) >= 0) gain *= 1.25;
    if (M.gear === 'cap') gain *= CFG.capSwagger;
    if (this.flourish && o.runs >= 4) { gain += 0.12; Snd.sting('flourish'); }
    if (gain > 0) { M.swagger = clamp(M.swagger + gain, 0, 1); b.dots = 0; }
    else { b.dots++; M.swagger = clamp(M.swagger - (b.dots >= 2 ? 0.16 : 0.08), 0, 1); }
    if (o.runs >= 4) { M.bowlerMood = Math.min(1, M.bowlerMood + 0.4); Snd.sting(o.runs === 6 ? 'six' : 'four'); }
    if (this.ghost) M.dossier[this.zone] += o.runs >= 4 ? 2 : o.runs > 0 ? 1 : 0;
    M.say(o.label, o.runs >= 4);
  },

  after() {
    const b = M.bat;
    if (b.out || (M.mode !== 'batPractice' && b.balls >= b.overs * 6)) {
      Match.endInnings();
    } else {
      if (M.tier.dossier && b.balls % 6 === 0) M.field = buildField(M.tier, M.dossier);
      this.nextBall();
    }
  },
};

/* ===================== BOWLING =====================
   One gesture. Point at the spot on the pitch where you want the ball to
   land and let go — that is line and length together, untimed. Which ball it
   is comes from your bowler's repertoire, picked once and changed between
   overs. There is nothing to execute, so the skill is entirely tactical:
   where to put it, which variation, and reading what the batter does about it.

   Hostility still matters. It narrows the batter's window rather than
   rolling his dismissal, so you can watch him get worse. */

/* Where the drag points. Mapping the finger straight onto the pitch through
   the projection would squeeze the whole aiming range into a sixty-pixel
   strip near the horizon, so the gesture uses a comfortable band of the
   screen instead: up the screen is fuller, and you drag toward the side you
   want it on. */
function aimFrom(sx, sy) {
  const hz = VH * HORIZON;
  const ty = clamp((sy - hz - 30) / (VH - 170 - hz), 0, 1);
  const tx = clamp((sx - VW * 0.22) / (VW * 0.56), 0, 1);
  return {
    x: lerp(20.2, 10.5, ty),               // up the screen pitches it fuller
    z: lerp(2.2, -2.0, tx),                // the off side is on your left
  };
}

const Bowl = {
  phase: 'aim', t: 0,
  bowler: BOWLERS[0], vi: 0,
  tx: 16.4, tz: 0.35,
  d: null, pred: null, ai: null, outcome: null, ghost: null,
  flinch: 0, surprise: 0, aiQuality: null, loose: false,

  chips() {
    const w = 210, gap = 14, y = VH - 78;
    const total = this.bowler.vars.length * w + (this.bowler.vars.length - 1) * gap;
    let x = VW / 2 - total / 2;
    return this.bowler.vars.map((v, i) => {
      const r = { x: x, y: y, w: w, h: 58, label: v.n, i: i };
      x += w + gap;
      return r;
    });
  },
  changeBtn() { return { x: VW - 226, y: 96, w: 186, h: 48, label: 'CHANGE' }; },
  inRect(r, px, py) { return px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h; },

  nextBall() {
    this.phase = 'aim'; this.t = 0;
    this.outcome = null; this.ghost = null; this.ai = null; this.aiQuality = null;
    Ball.live = false;
    Input.flush();
    M.field.forEach(f => { f.px = f.x; f.pz = f.z; });
    M.track = [];
    Cam.use(VIEW.bowl, false);
    Snd.mode = 'bowl';
  },

  update(dt) {
    this.t += dt;

    if (this.phase === 'aim') {
      // chips and the change-bowler button are taps; anything else is the aim
      let tap, usedUI = false;
      while ((tap = Input.takeTap())) {
        const c = this.chips().filter(r => this.inRect(r, tap.x, tap.y))[0];
        if (c) { this.vi = c.i; usedUI = true; continue; }
        if (M.bowl.balls % 6 === 0 && this.inRect(this.changeBtn(), tap.x, tap.y)) {
          this.bowler = BOWLERS[(BOWLERS.indexOf(this.bowler) + 1) % BOWLERS.length];
          this.vi = 0; usedUI = true; continue;
        }
      }
      if (Input.down) {
        const g = aimFrom(Input.x, Input.y);
        this.tx = clamp(g.x, 9.5, 20.0); this.tz = clamp(g.z, -2.0, 2.2);
      }
      if (Input.keys.ArrowLeft) this.tz = clamp(this.tz - dt * 2.2, -2.0, 2.2);
      if (Input.keys.ArrowRight) this.tz = clamp(this.tz + dt * 2.2, -2.0, 2.2);
      if (Input.keys.ArrowUp) this.tx = clamp(this.tx + dt * 5, 9.0, 20.0);
      if (Input.keys.ArrowDown) this.tx = clamp(this.tx - dt * 5, 9.0, 20.0);
      for (let i = 0; i < this.bowler.vars.length; i++) {
        if (Input.keys['Digit' + (i + 1)]) this.vi = i;
      }
      const rel = Input.takeRelease();
      if (!usedUI && rel) {
        const onChip = this.chips().some(r => this.inRect(r, rel.ox, rel.oy));
        const onBtn = this.inRect(this.changeBtn(), rel.ox, rel.oy);
        if (!onChip && !onBtn) this.startRunup();
      }
      return;
    }

    if (this.phase === 'runup') {
      if (this.t >= this.runup) this.release();
      return;
    }

    if (this.phase === 'flight') {
      Ball.step(dt);
      if (Ball.hit) { chaseBall(M.field, dt); trackBall(); }
      if (!this.ai.played && now() >= this.ai.swingAt) this.playAI();
      if (this.ai.played && Ball.hit && this.outcome === null) {
        const r = resolveTravel(M.field, { sharpCatching: true, edged: this.aiQuality === 'edge' });
        if (r) this.finish(r);
        Snd.travelTo(200 + Ball.distFromCentre() * 9);
      }
      if (!Ball.hit && Ball.x > PITCH_LEN + 4) this.finish({ type: 'through' });
      if (this.t > 9) this.finish({ type: 'runs', runs: runsFromClock(Ball.liveT, Ball.x, Ball.z) });
      if (this.flinch > 0) this.flinch -= dt;
      return;
    }

    if (this.phase === 'result') {
      if (Ball.live) { Ball.step(dt); if (Ball.hit) chaseBall(M.field, dt); }
      if (this.t > (this.outcome && this.outcome.wicket ? 2.4 : 1.4)) this.after();
    }
  },

  startRunup() {
    const B = this.bowler;
    this.variation = B.vars[this.vi];
    this.pace = rnd(B.pace[0], B.pace[1]) * (this.variation.paceMul || 1);
    this.runup = B.pace[1] > 18 ? 1.15 : 0.85;
    this.phase = 'runup'; this.t = 0;
    Input.flush();
  },

  release() {
    const v = this.variation;
    const natural = bandByKey(v.band);
    // Bowling away from the ball's natural length is what costs you accuracy.
    const mismatch = clamp(Math.abs(this.tx - natural.px) / 4.2, 0, 1);
    const err = 0.26 + mismatch * 0.62;

    const pitchX = clamp(this.tx + randn() * err, 9.0, 20.1);
    const pitchZ = clamp(this.tz + randn() * err * 0.8, -2.4, 2.6);
    // Which band it actually landed in decides how it behaves off the pitch.
    let band = BANDS[0];
    for (const b of BANDS) if (Math.abs(pitchX - b.px) < Math.abs(pitchX - band.px)) band = b;
    if (v.band === 'bouncer') band = BOUNCER_BAND;

    this.d = {
      pace: this.pace,
      pitchX: pitchX, pitchZ: pitchZ,
      releaseZ: pitchZ * 0.35 + 0.28,
      rest: band.rest * (v.bounceMul || 1),
      seamKick: (v.seam || 0) * rnd(0.75, 1.2) + randn() * 0.22,
      swingAcc: (v.swing || 0) * rnd(0.75, 1.15),
      band: band, bowler: this.bowler, variation: v,
    };
    this.pred = Ball.predict(this.d);
    Ball.deliver(this.d);
    this.releaseT = now();

    // Composition: purposeful variation is rewarded, random variation is
    // punished. The ball has to differ from the last two along one axis.
    const hist = M.bowl.lastBands;
    this.surprise = 0;
    if (hist.length >= 2) {
      const differsLen = hist.every(h => h.band !== band.key);
      const differsLine = hist.every(h => Math.abs(h.z - pitchZ) > 0.55);
      const differsKind = hist.every(h => h.v !== v.n);
      const settled = hist.every(h => h.band === hist[0].band) || hist.every(h => h.v === hist[0].v);
      if ((differsLen || differsLine || differsKind) && settled) this.surprise = 1;
    }
    hist.push({ band: band.key, z: pitchZ, v: v.n });
    if (hist.length > 2) hist.shift();

    // Hostility: pace at the body, a tight corridor, and the batter flinching.
    let gain = -0.03;                    // it decays if you stop earning it
    if (band.key === 'bouncer') gain += 0.16;
    if ((band.key === 'short' || band.key === 'bouncer') && Math.abs(pitchZ) < 0.7) gain += 0.08;
    if (Math.abs(pitchZ - 0.35) < 0.45 && band.key === 'good') {
      M.bowl.corridor++; gain += 0.03 * Math.min(3, M.bowl.corridor);
    } else M.bowl.corridor = 0;
    if (this.bowler.pace[1] > 20) gain += 0.03;
    if (mismatch > 0.7) gain -= 0.05;
    M.hostility = clamp(M.hostility + gain, 0, 1);

    this.prepAI();
    this.phase = 'flight'; this.t = 0;
    Snd.intensity = M.hostility;
  },

  /* The AI batter. Hostility narrows their window; it does not roll their
     dismissal. You can see them getting worse. */
  prepAI() {
    const T = M.tier;
    const contactT = this.releaseT + this.pred.t;
    const h = M.hostility;
    let best = 2, bs = -9;
    for (let i = 0; i < 6; i++) {
      const sc = shotAppropriate(SHOTS[i], this.pred.y, this.d.band.key) + rnd(0, 0.25);
      if (sc > bs) { bs = sc; best = i; }
    }
    if (Math.random() < h * 0.30) best = (best + (Math.random() < 0.5 ? 1 : 5)) % 6;
    // Lateral movement is hard to pick up: the more the ball has done, the
    // less certain he is where it will be.
    const moved = Math.abs(this.d.seamKick) * 0.035 + Math.abs(this.d.swingAcc) * 0.022;
    const sigma = T.aiSigma * (1 + h * 0.45 + this.surprise * 0.25 + moved);
    const err = randn() * sigma;
    const px = this.d.pitchX, pz = this.d.pitchZ;
    // Wide, or short and wide, or a half-volley outside off: the balls a
    // batter is waiting for. Bowling is tactical, so missing has to cost.
    this.loose = Math.abs(pz) > 1.05
              || ((px < 13.6 || px > 19.4) && Math.abs(pz) > 0.75)
              || (px > 18.9 && Math.abs(pz) > 0.55);
    const shy = h > 0.55 && (this.d.band.key === 'short' || this.d.band.key === 'bouncer')
              && Math.random() < h * 0.45;
    this.ai = {
      zone: best, err: err, played: false,
      swingAt: contactT + err, leave: shy || Math.random() < 0.04 + h * 0.06,
      contactT: contactT, sigma: sigma,
    };
    if (shy) this.flinch = 0.6;
  },

  playAI() {
    const T = M.tier;
    this.ai.played = true;
    if (this.ai.leave) { Snd.bat('miss'); return; }
    const shot = SHOTS[this.ai.zone];
    const approp = shotAppropriate(shot, this.pred.y, this.d.band.key);
    const widen = T.aiWindow * (0.72 + approp * 0.34) * (1 - M.hostility * 0.14)
                * (this.loose ? 1.62 : 1);
    const w = timingWindows({ widen: widen });
    const e = Math.abs(this.ai.err);
    const quality = e < w.middle ? 'middle' : e < w.good ? 'good' : e < w.edge ? 'edge' : 'air';
    if (quality === 'air') { Snd.bat('miss'); M.hostility = clamp(M.hostility + 0.06, 0, 1); return; }
    const aggressive = Math.random() < 0.35 + M.batterConf * 0.4 + (this.loose ? 0.45 : 0);
    const type = aggressive ? 'attack' : 'control';
    const cone = CFG.cone[quality] * (2 - approp);
    const angle = shot.ang + randn() * cone;
    const power = CFG.swingSpeed[type] * CFG.qualityMult[quality] * shot.power * approp;
    const lift = shot.lift * CFG.typeLift[type] * CFG.qualityLift[quality]
               + (quality === 'edge' ? rnd(0, 0.45) : 0);
    this.ghost = { intended: shot.ang, actual: angle };
    this.aiQuality = quality;
    playShot({ shot: shot, quality: quality, power: power, angleDeg: angle, lift: lift, contactY: this.pred.y });
    Snd.bat(quality === 'edge' ? 'edge' : 'middle');
    Snd.travel(220);
  },

  finish(r) {
    if (this.outcome) return;
    Snd.travelEnd();
    const b = M.bowl;
    b.balls++;
    const o = { wicket: false, runs: 0, label: '' };
    if (r.type === 'caught' || r.type === 'caughtBehind') {
      o.wicket = true; o.label = r.type === 'caughtBehind' ? 'CAUGHT BEHIND' : 'CAUGHT';
    } else if (r.type === 'six') { o.runs = 6; o.label = 'SIX'; }
    else if (r.type === 'four') { o.runs = 4; o.label = 'FOUR'; }
    else if (r.type === 'runs') {
      o.runs = r.runs;
      o.label = r.runs === 0 ? 'DOT' : r.runs + (r.runs === 1 ? ' RUN' : ' RUNS');
    } else {
      const hit = Math.abs(Ball.z) < STUMP_HALF_W + 0.05 && this.pred.y < STUMP_H + 0.12;
      if (hit) { o.wicket = true; o.label = 'BOWLED'; }
      else if (this.ai.leave) o.label = 'LEFT';
      else o.label = 'BEATEN';
    }
    if (o.label === 'BEATEN') {
      M.hostility = clamp(M.hostility + 0.08, 0, 1);
      M.batterConf = clamp(M.batterConf - 0.06, 0, 1);
    }
    if (o.runs > 0 && o.runs < 4) M.batterConf = clamp(M.batterConf + 0.04, 0, 1);
    if (o.runs >= 4) {
      M.hostility = clamp(M.hostility - 0.16, 0, 1);
      M.batterConf = clamp(M.batterConf + 0.12, 0, 1);
      Snd.sting(o.runs === 6 ? 'six' : 'four');
    }
    if (o.wicket) {
      b.wickets++; M.hostility = clamp(M.hostility + 0.14, 0, 1);
      M.batterConf = 0.4; Snd.sting('wicket'); Cam.kick(0.7);
      M.bowl.corridor = 0;
    }
    b.runs += o.runs;
    M.say(o.label, o.runs >= 4 || o.wicket);
    this.outcome = o;
    this.phase = 'result'; this.t = 0;
    Snd.intensity = M.hostility;
    Cam.push(o.wicket ? 840 : VIEW.bowl.f);
  },

  after() {
    const b = M.bowl;
    const done = (M.mode !== 'bowlPractice')
      && (b.balls >= b.overs * 6 || b.wickets >= b.maxWickets
          || (b.target > 0 && b.runs >= b.target));
    if (done) Match.finish();
    else this.nextBall();
  },
};

/* Sampled while a struck ball is live, for the wagon wheel. */
function trackBall() {
  const t = M.track;
  if (!t) return;
  const last = t[t.length - 1];
  if (!last || Math.hypot(Ball.x - last.x, Ball.z - last.z) > 1.2) {
    t.push({ x: Ball.x, z: Ball.z });
    if (t.length > 90) t.shift();
  }
}

/* ===================== MATCH FLOW =====================
   Five overs a side. You face every ball of your innings; if you go early
   the rest is simmed and you are bowling inside ten seconds. The zero is
   permanent, and the wait is nothing. */
const Match = {
  screen: 'menu', tier: TIERS[0],
  simTarget: 0, simShown: 0, breakT: 0, note: '',

  toGear(tier, mode) {
    this.tier = tier;
    M.reset(tier, mode);
    if (mode === 'bowlPractice') { this.begin(); return; }
    this.screen = 'gear';
  },
  begin() {
    this.screen = 'match';
    Snd.intensity = 0;
    Portal.playStart();
    if (M.phase === 'bat') { Snd.mode = 'bat'; Bat.lastBackliftZone = -1; Bat.nextBall(); }
    else { Snd.mode = 'bowl'; Bowl.nextBall(); }
  },
  endInnings() {
    if (M.mode === 'batPractice') { this.finish(); return; }
    const rate = M.tier.key === 'club' ? 1.05 : 1.2;
    const left = Math.max(0, M.bat.overs * 6 - M.bat.balls);
    M.bat.teamRuns = M.bat.runs + Math.round(left * rate * rnd(0.6, 1.5)) + Math.round(rnd(6, 26));
    this.simTarget = M.bat.teamRuns; this.simShown = M.bat.runs;
    this.screen = 'break'; this.breakT = 0;
    Snd.mode = 'bowl'; Snd.intensity = 0;
  },
  startBowling() {
    M.phase = 'bowl';
    M.bowl.target = M.bat.teamRuns + 1;
    M.field = buildField(M.tier, null);
    this.screen = 'match';
    Bowl.nextBall();
  },
  finish() {
    this.screen = 'result';
    Portal.playStop();
    const b = M.bat, w = M.bowl;
    if (M.mode === 'match') {
      this.won = w.runs <= b.teamRuns && !(w.runs > b.teamRuns);
      this.tie = w.runs === b.teamRuns + 0 && w.wickets < w.maxWickets && w.balls >= w.overs * 6 && w.runs === b.teamRuns;
      this.margin = this.won ? (b.teamRuns - w.runs) + ' RUNS' : (w.maxWickets - w.wickets) + ' WICKETS';
    }
    this.note = selectorNote();
    if (b.runs > Save.data.bestRuns) { Save.data.bestRuns = b.runs; }
    Save.data.played++; Save.data.seen = true; Save.save();
    if (b.runs >= 30 || w.wickets >= 3) Portal.happy();
  },
};

function selectorNote() {
  const b = M.bat, w = M.bowl;
  if (b.runs === 0 && b.balls <= 1) return '"Everyone gets one of those. Not everyone gets two."';
  if (b.sixes >= 2) return '"He didn\'t look at the bowler once. Not once."';
  if (w.wickets >= 3) return '"Bowled like he meant it. Keep him on."';
  if (b.runs >= 40) return '"Made it look like a different game."';
  if (b.runs < 8 && w.wickets === 0) return '"Quiet day. There\'s a fixture next week."';
  return '"Useful. We\'ll see him again."';
}

/* ===================== SCENE ===================== */
function drawLengthMarker(x, z, colour, alpha, w) {
  const hw = w || 0.55;
  ctx.globalAlpha = alpha === undefined ? 0.75 : alpha;
  Art.poly([
    proj(x - hw, 0.01, z - 0.42), proj(x + hw, 0.01, z - 0.42),
    proj(x + hw, 0.01, z + 0.42), proj(x - hw, 0.01, z + 0.42),
  ], colour);
  ctx.globalAlpha = 1;
}

/* The shot fan, drawn around the batter. Straight is up the screen, the off
   side swings right and leg swings left, so the arrow points where the ball
   is going even for the shots played behind square. */
function drawShotFan(active) {
  const b = proj(CONTACT_X, 0.95, -0.75);
  if (b.behind) return;
  for (let i = 0; i < 6; i++) {
    const on = i === active;
    const a = shotBearing(SHOTS[i].ang);
    const r0 = on ? 96 : 104, r1 = on ? 224 : 158;
    const x0 = b.x + Math.cos(a) * r0, y0 = b.y + Math.sin(a) * r0;
    const x1 = b.x + Math.cos(a) * r1, y1 = b.y + Math.sin(a) * r1;
    ctx.globalAlpha = on ? 0.95 : 0.30;
    ctx.strokeStyle = on ? PAL.gold : 'rgba(255,255,255,0.8)';
    ctx.lineWidth = on ? 8 : 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    if (on) {
      Art.poly([
        { x: x1 + Math.cos(a) * 22, y: y1 + Math.sin(a) * 22 },
        { x: x1 + Math.cos(a - 2.5) * 20, y: y1 + Math.sin(a - 2.5) * 20 },
        { x: x1 + Math.cos(a + 2.5) * 20, y: y1 + Math.sin(a + 2.5) * 20 },
      ], PAL.gold);
      const lx = b.x + Math.cos(a) * (r1 + 52), ly = b.y + Math.sin(a) * (r1 + 52);
      Art.text(SHOTS[i].name, clamp(lx, 70, VW - 70), clamp(ly, 40, VH - 130), 24, PAL.gold);
    }
    ctx.globalAlpha = 1;
  }
}

/* A wagon wheel in the corner. From behind the stumps a cut or a glance
   leaves the frame almost immediately, so this is where you actually read
   where the ball went — and it doubles as the Dossier's readout. */
function drawWagon() {
  const cx = 112, cy = VH - 116, R = 84;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath(); ctx.arc(cx, cy, R + 8, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(63,156,65,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();

  // the strip, with the striker's end at the bottom
  const map = (wx, wz) => ({
    x: cx + (wz / boundaryR()) * R,
    y: cy + ((wx - PITCH_LEN / 2) / boundaryR()) * R,
  });
  const a = map(0, 0), b2 = map(PITCH_LEN, 0);
  ctx.strokeStyle = 'rgba(201,168,106,0.95)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();

  (M.field || []).forEach(f => {
    const q = map(f.x, f.z);
    Art.disc(q, f.keeper ? 2.5 : 3.4, f.flagged ? PAL.gold : 'rgba(255,255,255,0.92)');
  });
  if (M.track && M.track.length > 1) {
    ctx.strokeStyle = PAL.gold; ctx.lineWidth = 3;
    ctx.beginPath();
    M.track.forEach((t, i) => {
      const q = map(t.x, t.z);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    });
    ctx.stroke();
    const last = map(M.track[M.track.length - 1].x, M.track[M.track.length - 1].z);
    Art.disc(last, 4, PAL.ball);
  }
  ctx.restore();
}

function drawBowlerRunup(p, fromBowlEnd) {
  // The long walk back carries Hostility between deliveries; the run itself
  // is eight shapes and a rotating hand-blob, which is the only tell there is.
  const x = lerp(fromBowlEnd ? -4.0 : -8.5, RELEASE_X, p);
  const cycle = Math.sin(p * 34) * 34;
  Art.shadow(x, 0.35, 0.4, 0.2);
  const f = drawFigure(x, 0.35, {
    face: 1, shirt: PAL.maroonLite, cap: 'cap',
    legF: 20 + cycle, legB: -20 - cycle,
    armF: -60 + cycle * 1.4, armB: 40 - cycle,
    lean: 1.6 + p * 2,
  });
  // the ball in the hand, seam showing
  const hb = { x: f.handF.x, y: f.handF.y };
  Art.disc(hb, Math.max(2, f.u * 0.09), PAL.ball);
  ctx.save();
  ctx.translate(hb.x, hb.y); ctx.rotate(now() * 9);
  ctx.strokeStyle = PAL.white; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-f.u * 0.08, 0); ctx.lineTo(f.u * 0.08, 0); ctx.stroke();
  ctx.restore();
}

function drawBowlerReaction(mood, fromBowlEnd) {
  // waiting at the top of his mark, off to the side of his own camera
  const x = fromBowlEnd ? -1.2 : 3.5;
  const z = fromBowlEnd ? 1.5 : 0.35;
  Art.shadow(x, z, 0.4, 0.2);
  if (mood > 0.35) {                     // hands on head
    drawFigure(x, z, { face: 1, shirt: PAL.maroonLite, cap: 'cap', armF: 150, armB: 150, legF: 12, legB: -12 });
  } else if (mood < -0.3) {              // a stare down the pitch
    drawFigure(x, z, { face: 1, shirt: PAL.maroonLite, cap: 'cap', armF: 8, armB: -8, legF: 26, legB: -26, lean: 2 });
  } else {
    drawFigure(x, z, { face: 1, shirt: PAL.maroonLite, cap: 'cap', armF: 18, armB: -14, legF: 14, legB: -14 });
  }
}

/* The batter. His stance is the Swagger readout — pure feedback, no
   mechanical effect, and it is the thing players talk about. */
function drawBatter(x, opts, zPos) {
  const sw = M.swagger;
  const idle = Math.sin(now() * (2.4 - sw * 1.1)) * (2 + sw * 4);
  const o = Object.assign({
    face: -1, shirt: PAL.maroon, pads: true, bat: true,
    cap: M.gear === 'cap' ? 'cap' : 'helmet',
    legF: 26 + sw * 8, legB: -26 - sw * 8,
    armF: 32, armB: -18, lean: -1 + sw * 2.2,
    batAng: -150 - sw * 26 + idle,        // the backlift gets higher and lazier
  }, opts);
  const z = zPos === undefined ? -0.75 : zPos;   // stands to the leg side
  Art.shadow(x, z, 0.42, 0.24);
  return drawFigure(x, z, o);
}

function drawScene() {
  const T = M.tier;
  const batting = M.phase === 'bat';
  drawGround(T);
  drawCrowd(T);
  drawStumps(0, false);
  drawStumps(PITCH_LEN, true);

  if (batting) {
    // the length marker, painted where it will pitch
    if (Bat.marker) drawLengthMarker(Bat.marker.x, Bat.marker.z, PAL.gold, 0.65);
    drawField(M.field, T, '#1f4f8a');
    if (Bat.phase === 'runup') drawBowlerRunup(clamp(Bat.t / Bat.runup, 0, 1));
    else if (Bat.phase === 'flight') drawBowlerRunup(1);
    else drawBowlerReaction(M.bowlerMood);
    Ball.draw();

    const hold = Input.charging();
    const swinging = Bat.swung && Bat.swingInfo && Bat.swingInfo.quality !== 'miss' && Bat.t < 0.4;
    drawBatter(CONTACT_X + 0.55, swinging ? {
      batAng: -20, armF: 96, armB: 60, lean: 2.5, legF: 34, legB: -28,
    } : hold && Bat.phase !== 'result' ? { batAng: -186, armF: 46, armB: -6, lean: -2 } : {});

    if (!Bat.swung && (Bat.phase === 'ready' || Bat.phase === 'runup' || Bat.phase === 'flight')) {
      drawShotFan(Bat.zone);
    }
  } else {
    // bowling: the batter down the other end, flinching as Hostility bites
    const fl = Bowl.flinch > 0;
    drawBatter(CONTACT_X + 0.55, {
      shirt: '#1f4f8a', cap: 'helmet',
      lean: fl ? -8 : -1 + M.batterConf * 2,
      armF: fl ? 130 : 32, armB: fl ? 120 : -18,
      batAng: fl ? -230 : -150, crouch: fl ? 2 : 0,
    });
    drawField(M.field, T, PAL.maroonLite);
    if (Bowl.phase === 'aim') drawTargetMarker();
    Ball.draw();
    if (Bowl.phase === 'runup') drawBowlerRunup(clamp(Bowl.t / Bowl.runup, 0, 1), true);
    else if (Bowl.phase === 'flight' || Bowl.phase === 'result') drawBowlerRunup(1, true);
    else drawBowlerReaction(0, true);
  }
}

/* Where you are asking the ball to land. */
function drawTargetMarker() {
  const x = Bowl.tx, z = Bowl.tz;
  const a = proj(x - 0.75, 0.01, z - 0.55), b = proj(x + 0.75, 0.01, z - 0.55);
  const c = proj(x + 0.75, 0.01, z + 0.55), d = proj(x - 0.75, 0.01, z + 0.55);
  if (a.behind || b.behind || c.behind || d.behind) return;
  ctx.globalAlpha = 0.72 + Math.sin(now() * 5) * 0.2;
  Art.poly([a, b, c, d], PAL.gold);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.stroke();
  // a stalk, so the mark is findable from twenty metres away
  const top = proj(x, 2.4, z), base = proj(x, 0, z);
  if (!top.behind && !base.behind) {
    ctx.globalAlpha = 0.75;
    Art.line(base, top, 3, PAL.gold);
    ctx.globalAlpha = 1;
    Art.disc(top, Math.max(3, 0.16 * top.s * PPM), PAL.gold);
    let bd = BANDS[0];
    for (const q of BANDS) if (Math.abs(x - q.px) < Math.abs(x - bd.px)) bd = q;
    Art.text(bd.label, top.x, top.y - 14, 20, PAL.gold);
  }
}

/* ===================== HUD =====================
   Chunky numerals top-centre, poster weight, no panels. Swagger and
   Hostility are the only meters. A stranger walking past should be able to
   read the score and who is winning. */
function meterColour(v) {
  const h = lerp(48, 0, clamp(v, 0, 1) * (v > 0.85 ? 1 : 0.7));
  return 'hsl(' + h + ',85%,' + lerp(48, 58, v) + '%)';
}

function drawMeter(x, y, w, h, v, label, full) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = meterColour(v);
  ctx.fillRect(x, y, w * clamp(v, 0, 1), h);
  if (full) {                            // the meter is the instruction
    const pulse = 0.55 + Math.sin(now() * 9) * 0.45;
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = PAL.white; ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    ctx.globalAlpha = 1;
  }
  Art.text(label, x, y - 9, 19, full ? PAL.gold : 'rgba(255,255,255,0.85)', 'left');
}

function drawHUD() {
  const b = M.bat, w = M.bowl;
  ctx.save();
  if (M.phase === 'bat') {
    const ov = Math.floor(b.balls / 6) + '.' + (b.balls % 6);
    Art.text(b.runs + ' (' + b.balls + ')', VW / 2, 62, 58, PAL.white);
