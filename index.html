    Art.text(M.mode === 'batPractice' ? 'PRACTICE  ' + ov + ' OV'
      : ov + ' / ' + b.overs + ' OV   ·   ' + b.fours + 'x4  ' + b.sixes + 'x6',
      VW / 2, 92, 21, 'rgba(255,255,255,0.8)');
    drawMeter(40, 68, 300, 22, M.swagger, 'SWAGGER', M.swagger >= 0.999);
    if (M.swagger >= 0.999) Art.text('HOLD FOR THE FLOURISH', 40, 116, 17, PAL.gold, 'left');
    if (M.gear === 'cap') Art.text('CAP', VW - 40, 62, 26, PAL.gold, 'right');
    else Art.text('HELMET', VW - 40, 62, 22, 'rgba(255,255,255,0.7)', 'right');
    if (Bat.phase === 'runup' && Input.charging()) Art.text('BACKLIFT UP', VW - 40, 96, 20, PAL.gold, 'right');
    if (Bat.bowler) {
      const bg = ctx.createLinearGradient(0, VH - 120, 0, VH);
      bg.addColorStop(0, 'rgba(10,6,8,0)');
      bg.addColorStop(1, 'rgba(10,6,8,0.66)');
      ctx.fillStyle = bg; ctx.fillRect(0, VH - 120, VW, 120);
      Art.text(Bat.bowler.name, VW / 2, VH - 24, 24, 'rgba(255,255,255,0.85)');
      // what it actually was, once it is too late to help you
      if (Bat.variation && (Bat.phase === 'result' || Bat.swung)) {
        Art.text(Bat.variation.n, VW / 2, VH - 58, 28, PAL.gold);
      }
    }
  } else {
    const ov = Math.floor(w.balls / 6) + '.' + (w.balls % 6);
    Art.text(w.runs + '-' + w.wickets, VW / 2, 62, 58, PAL.white);
    Art.text(ov + (M.mode === 'bowlPractice' ? ' OV  PRACTICE' : ' / ' + w.overs + ' OV'
      + (w.target ? '   ·   NEED ' + Math.max(0, w.target - w.runs) : '')),
      VW / 2, 92, 21, 'rgba(255,255,255,0.8)');
    drawMeter(40, 68, 300, 22, M.hostility, 'HOSTILITY', M.hostility >= 0.85);
    // batter confidence tick
    Art.text('BATTER', VW - 178, 62, 16, 'rgba(255,255,255,0.6)', 'left');
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(VW - 178, 70, 138, 12);
    ctx.fillStyle = M.batterConf > 0.55 ? '#5fd07a' : M.batterConf > 0.3 ? '#e8b923' : '#d0483f';
    ctx.fillRect(VW - 178, 70, 138 * clamp(M.batterConf, 0, 1), 12);
  }
  ctx.restore();
}

/* Big events get full-screen chunky type, held half a second. */
function drawBanner() {
  if (!M.msg) return;
  const age = now() - M.msgT;
  if (age > 1.5) return;
  const pop = age < 0.12 ? 1 + (0.12 - age) * 4 : 1;
  const alpha = age > 1.1 ? 1 - (age - 1.1) / 0.4 : 1;
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(VW / 2, VH * 0.36);
  ctx.scale(pop, pop);
  const size = M.msgBig ? 96 : 54;
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.font = '900 ' + size + 'px "Arial Black", Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeText(M.msg, 0, 0);
  Art.text(M.msg, 0, 0, size, M.msgBig ? PAL.gold : PAL.white);
  ctx.restore();
}

/* The bowling overlay. There is nothing to time — you point at the pitch and
   let go — so all this has to say is who is bowling and what ball it is. */
function drawBowlUI() {
  if (M.phase !== 'bowl' || Match.screen !== 'match') return;
  const g = ctx.createLinearGradient(0, VH - 200, 0, VH);
  g.addColorStop(0, 'rgba(10,6,8,0)');
  g.addColorStop(1, 'rgba(10,6,8,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, VH - 200, VW, 200);
  const B = Bowl.bowler;
  Art.text(B.name, 40, 132, 27, PAL.gold, 'left');

  if (Bowl.phase === 'aim') {
    Bowl.chips().forEach((r, i) => {
      const on = i === Bowl.vi;
      ctx.fillStyle = on ? PAL.gold : 'rgba(0,0,0,0.5)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = on ? PAL.gold : 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 3; ctx.strokeRect(r.x, r.y, r.w, r.h);
      Art.text(r.label, r.x + r.w / 2, r.y + r.h / 2 + 9, 23, on ? PAL.ink : PAL.white);
    });
    Art.text('DRAG TO THE SPOT — LET GO TO BOWL', VW / 2, VH - 108, 23, 'rgba(255,255,255,0.92)');
    if (M.bowl.balls % 6 === 0) {
      const c = Bowl.changeBtn();
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(c.x, c.y, c.w, c.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 2;
      ctx.strokeRect(c.x, c.y, c.w, c.h);
      Art.text('CHANGE BOWLER', c.x + c.w / 2, c.y + c.h / 2 + 7, 18, PAL.white);
    }
  } else if (Bowl.variation) {
    Art.text(Bowl.variation.n, VW / 2, VH - 72, 34, PAL.white);
  }
}

/* ===================== SCREENS ===================== */
const UI = { hits: [] };
function uiBtn(x, y, w, h, label, sub, hot) {
  UI.hits.push({ x: x, y: y, w: w, h: h, id: label });
  ctx.fillStyle = hot ? PAL.gold : 'rgba(0,0,0,0.45)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hot ? PAL.gold : PAL.white; ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);
  Art.text(label, x + w / 2, y + (sub ? h / 2 : h / 2 + 11), 30, hot ? PAL.ink : PAL.white);
  if (sub) Art.text(sub, x + w / 2, y + h / 2 + 28, 17, hot ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.7)', 'center', '700');
  return label;
}
function uiTake() {
  const t = Input.takeTap();
  if (!t) return null;
  for (const h of UI.hits) {
    if (t.x > h.x && t.x < h.x + h.w && t.y > h.y && t.y < h.y + h.h) return h.id;
  }
  return '__miss__';
}

function drawMenu() {
  ctx.fillStyle = PAL.maroon; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = PAL.maroonLite;
  for (let i = 0; i < 9; i++) ctx.fillRect(0, i * 90 + (i % 2) * 6, VW, 30);
  Art.text('GRADE', VW / 2, 168, 104, PAL.gold);
  Art.text('CRICKET', VW / 2, 262, 104, PAL.white);
  Art.text('SWAGGER  ·  HOSTILITY  ·  ONE BALL AT A TIME', VW / 2, 302, 20, 'rgba(255,255,255,0.75)');

  uiBtn(VW / 2 - 460, 348, 300, 96, 'QUICK MATCH', '5 overs each · bat then bowl');
  uiBtn(VW / 2 - 150, 348, 300, 96, 'BATTING', 'endless · learn the fan');
  uiBtn(VW / 2 + 160, 348, 300, 96, 'BOWLING', 'endless spell · build Hostility');

  const t = Match.tier;
  Art.text('TIER', VW / 2, 494, 20, 'rgba(255,255,255,0.7)');
  uiBtn(VW / 2 - 230, 508, 220, 62, 'CLUB', null, t === TIERS[0]);
  uiBtn(VW / 2 + 10, 508, 220, 62, 'ISLAND', null, t === TIERS[1]);

  Art.text(Save.data.bestRuns > 0 ? 'BEST INNINGS: ' + Save.data.bestRuns : 'TAP TO BEGIN',
    VW / 2, 614, 22, PAL.gold);
  Art.text('TOUCH: hold anywhere, drag to aim, release to play   ·   KEYS: 1-6 aim, SPACE swing, M mute',
    VW / 2, 664, 17, 'rgba(255,255,255,0.6)', 'center', '700');

  const id = uiTake();
  if (id === 'QUICK MATCH') Match.toGear(Match.tier, 'match');
  else if (id === 'BATTING') Match.toGear(Match.tier, 'batPractice');
  else if (id === 'BOWLING') Match.toGear(Match.tier, 'bowlPractice');
  else if (id === 'CLUB') Match.tier = TIERS[0];
  else if (id === 'ISLAND') Match.tier = TIERS[1];
}

/* One tap, permanent for the innings, real consequence. */
function drawGear() {
  ctx.fillStyle = PAL.maroon; ctx.fillRect(0, 0, VW, VH);
  Art.text('CAP OR HELMET', VW / 2, 150, 68, PAL.white);
  Art.text('Chosen before every innings.', VW / 2, 192, 22, 'rgba(255,255,255,0.75)');
  uiBtn(VW / 2 - 430, 250, 400, 240, 'CAP', null, true);
  Art.text('Swagger builds 40% faster.', VW / 2 - 230, 400, 20, 'rgba(0,0,0,0.75)', 'center', '700');
  Art.text('The short ball is a problem.', VW / 2 - 230, 428, 20, 'rgba(0,0,0,0.75)', 'center', '700');
  uiBtn(VW / 2 + 30, 250, 400, 240, 'HELMET', null, false);
  Art.text('Nothing special happens.', VW / 2 + 230, 400, 20, 'rgba(255,255,255,0.7)', 'center', '700');
  Art.text('Nothing bad happens either.', VW / 2 + 230, 428, 20, 'rgba(255,255,255,0.7)', 'center', '700');
  Art.text(Match.tier.name + '   ·   ' + (M.mode === 'match' ? '5 OVERS' : 'PRACTICE'),
    VW / 2, 560, 24, PAL.gold);
  const id = uiTake();
  if (id === 'CAP') { M.gear = 'cap'; Match.begin(); }
  else if (id === 'HELMET') { M.gear = 'helmet'; Match.begin(); }
}

/* The rest of the innings compresses — never a wall of numbers. */
function drawBreak(dt) {
  Match.breakT += dt;
  Match.simShown = Math.min(Match.simTarget,
    Match.simShown + Math.max(1, (Match.simTarget - M.bat.runs) * dt * 0.9));
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);
  Art.text('YOUR INNINGS', VW / 2, 150, 30, 'rgba(255,255,255,0.7)');
  const b = M.bat;
  Art.text(b.out ? b.runs + ' (' + b.balls + ')  ' + b.howOut : b.runs + ' (' + b.balls + ') NOT OUT',
    VW / 2, 226, 72, PAL.gold);
  Art.text(b.fours + ' FOURS   ·   ' + b.sixes + ' SIXES', VW / 2, 268, 22, 'rgba(255,255,255,0.75)');
  Art.text('THE REST OF THE INNINGS', VW / 2, 372, 26, 'rgba(255,255,255,0.7)');
  Art.text(Math.round(Match.simShown) + ' ALL OUT', VW / 2, 448, 64, PAL.white);
  if (Match.breakT > 2.2) {
    uiBtn(VW / 2 - 190, 520, 380, 80, 'TAKE THE BALL', 'defend ' + (Match.simTarget + 1));
    if (uiTake() === 'TAKE THE BALL') Match.startBowling();
  }
}

function drawResult() {
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);
  const b = M.bat, w = M.bowl;
  let head = 'STUMPS';
  if (M.mode === 'match') head = w.runs > b.teamRuns ? 'BEATEN' : w.runs === b.teamRuns ? 'TIED' : 'WON';
  Art.text(head, VW / 2, 128, 76, head === 'WON' ? PAL.gold : PAL.white);
  if (M.mode === 'match') {
    Art.text('YOU ' + b.teamRuns + '   ·   THEM ' + w.runs + '-' + w.wickets, VW / 2, 176, 26, 'rgba(255,255,255,0.8)');
  }
  Art.text('BATTING', VW / 2 - 250, 268, 24, 'rgba(255,255,255,0.6)');
  Art.text(b.balls === 0 ? 'DNB' : b.runs + ' (' + b.balls + ')', VW / 2 - 250, 328, 54, PAL.gold);
  Art.text(b.fours + 'x4  ' + b.sixes + 'x6', VW / 2 - 250, 362, 20, 'rgba(255,255,255,0.7)');
  Art.text('BOWLING', VW / 2 + 250, 268, 24, 'rgba(255,255,255,0.6)');
  const ov = Math.floor(w.balls / 6) + (w.balls % 6 ? '.' + (w.balls % 6) : '');
  Art.text(w.balls === 0 ? '—' : ov + '-0-' + w.runs + '-' + w.wickets, VW / 2 + 250, 328, 54, PAL.gold);
  Art.text('THE SELECTOR', VW / 2, 434, 20, 'rgba(255,255,255,0.6)');
  Art.text(Match.note, VW / 2, 470, 24, PAL.white, 'center', '700');
  uiBtn(VW / 2 - 330, 528, 300, 84, 'PLAY AGAIN', null, true);
  uiBtn(VW / 2 + 30, 528, 300, 84, 'MENU');
  const id = uiTake();
  if (id === 'PLAY AGAIN') Match.toGear(Match.tier, M.mode);
  else if (id === 'MENU') { Match.screen = 'menu'; Snd.intensity = 0; }
}

/* ===================== LOOP ===================== */
let canvas, last = 0, scale = 1, offX = 0, offY = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
  canvas._dpr = dpr;
  document.getElementById('rotate').classList.toggle('on', h > w * 1.05 && !UI.rotateDismissed);
}

function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let dt = last ? Math.min(0.05, t - last) : 0.016;
  last = t;

  Snd.tick();
  if (M.hitstop > 0) { M.hitstop -= dt; dt = 0; }   // contact is the reward
  Cam.update(dt);

  if (Match.screen === 'match') {
    if (M.phase === 'bat') { Snd.intensity = M.swagger; Bat.update(dt); }
    else { Bowl.update(dt); }
  }

  const d = canvas._dpr;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = '#14060a';
  ctx.fillRect(0, 0, canvas.width / d, canvas.height / d);
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  UI.hits.length = 0;

  if (Match.screen === 'menu') drawMenu();
  else if (Match.screen === 'gear') drawGear();
  else if (Match.screen === 'break') drawBreak(dt);
  else if (Match.screen === 'result') drawResult();
  else {
    drawScene();
    if (M.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (M.flash * 0.35) + ')';
      ctx.fillRect(0, 0, VW, VH);
      M.flash = Math.max(0, M.flash - dt * 6);
    }
    drawWagon();
    drawBowlUI();
    drawHUD();
    drawBanner();
    Input.taps.length = 0;               // gameplay reads presses, not taps
  }
  ctx.restore();
}

/* ===================== BOOT ===================== */
function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  Save.load();
  Portal.init();
  Portal.loadStart();
  Input.init(canvas);
  M.reset(TIERS[0], 'match');
  Cam.use(VIEW.bat, true);
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.getElementById('rotate').addEventListener('click', () => {
    UI.rotateDismissed = true;
    document.getElementById('rotate').classList.remove('on');
  });
  Portal.loadStop();
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
